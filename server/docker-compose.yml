services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: windrunner
      POSTGRES_USER: ${POSTGRES_USER:-windrunner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-windrunner}
    volumes:
      # PG 18+ images expect the mount at /var/lib/postgresql (data lands
      # in a versioned subdirectory, enabling in-place upgrades later).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-windrunner} -d windrunner"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Pulled from Docker Hub. Building from source instead? See the
    # Installation guide's "Building from source" section.
    image: shzlwio/windrunner:2.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/windrunner
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-windrunner}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-windrunner}
      # The seed spec defaults to concurrency 4. Increase this when running
      # higher-concurrency seeds; audited writes may briefly use extra connections.
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-10}

      # Bootstrap superadmin, only created when no users exist.
      WINDRUNNER_BOOTSTRAP_SUPERADMIN_USERNAME: ${WINDRUNNER_BOOTSTRAP_SUPERADMIN_USERNAME:-admin}
      WINDRUNNER_BOOTSTRAP_SUPERADMIN_EMAIL: ${WINDRUNNER_BOOTSTRAP_SUPERADMIN_EMAIL:-admin@localhost}
      WINDRUNNER_BOOTSTRAP_SUPERADMIN_PASSWORD: ${WINDRUNNER_BOOTSTRAP_SUPERADMIN_PASSWORD:-changeme}

      # Set to true when serving over HTTPS behind a reverse proxy.
      WINDRUNNER_AUTH_COOKIE_SECURE: ${WINDRUNNER_AUTH_COOKIE_SECURE:-false}

      # Optional AI features. Pick one provider, supply its API key, and restart.
      WINDRUNNER_LLM_PROVIDER: ${WINDRUNNER_LLM_PROVIDER:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      OPENROUTER_SITE_NAME: ${OPENROUTER_SITE_NAME:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_BASE_URL: ${CLAUDE_BASE_URL:-https://api.anthropic.com/v1}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5}

    ports:
      - "${APP_PORT:-8066}:8066"

volumes:
  pgdata:
