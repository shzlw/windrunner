spring.main.banner-mode=off
spring.application.name=windrunner
spring.jmx.enabled=false

server.port=8066
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.forward-headers-strategy=framework

server.compression.enabled=true
server.compression.min-response-size=2KB

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.info.env.enabled=false
info.app.name=${spring.application.name}
info.app.description=Windrunner server

spring.ai.mcp.server.enabled=${WINDRUNNER_MCP_ENABLED:true}
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.name=windrunner
spring.ai.mcp.server.version=${info.app.version:2.0}

windrunner.openapi.enabled=true
springdoc.api-docs.enabled=${windrunner.openapi.enabled}
springdoc.api-docs.path=/api/openapi.json
springdoc.packages-to-scan=com.windrunner.server.external.v1.api
springdoc.paths-to-match=/api/v1/**

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=0B
spring.servlet.multipart.location=${WINDRUNNER_UPLOAD_TEMP_DIR:${java.io.tmpdir}}

windrunner.auth.cookie.secure=true

windrunner.llm.agent-timeout=150s
windrunner.llm.openai.api-key=${OPENAI_API_KEY:}
windrunner.llm.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
windrunner.llm.openai.model=${OPENAI_MODEL:gpt-5.6-luna}
windrunner.llm.openai.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:2048}
windrunner.llm.openai.reasoning-effort=${OPENAI_REASONING_EFFORT:low}
windrunner.llm.openai.max-tool-rounds=${OPENAI_MAX_TOOL_ROUNDS:8}
windrunner.llm.openai.parallel-tool-calls=true
windrunner.llm.openai.parallel-tool-timeout=30s

windrunner.llm.openrouter.api-key=${OPENROUTER_API_KEY:}
windrunner.llm.openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
windrunner.llm.openrouter.model=${OPENROUTER_MODEL:}
windrunner.llm.openrouter.site-url=${OPENROUTER_SITE_URL:}
windrunner.llm.openrouter.site-name=${OPENROUTER_SITE_NAME:}
windrunner.llm.openrouter.max-output-tokens=${OPENROUTER_MAX_OUTPUT_TOKENS:2048}
windrunner.llm.openrouter.reasoning-effort=${OPENROUTER_REASONING_EFFORT:}
windrunner.llm.openrouter.max-tool-rounds=${OPENROUTER_MAX_TOOL_ROUNDS:8}
windrunner.llm.openrouter.parallel-tool-calls=true
windrunner.llm.openrouter.parallel-tool-timeout=30s

windrunner.llm.ollama.api-key=${OLLAMA_API_KEY:}
windrunner.llm.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434/v1}
windrunner.llm.ollama.model=${OLLAMA_MODEL:}
windrunner.llm.ollama.max-output-tokens=${OLLAMA_MAX_OUTPUT_TOKENS:2048}
windrunner.llm.ollama.reasoning-effort=${OLLAMA_REASONING_EFFORT:}
windrunner.llm.ollama.max-tool-rounds=${OLLAMA_MAX_TOOL_ROUNDS:8}
windrunner.llm.ollama.parallel-tool-calls=false
windrunner.llm.ollama.parallel-tool-timeout=30s

windrunner.audio.transcription.enabled=false
windrunner.audio.transcription.provider=openai
windrunner.audio.transcription.max-duration-seconds=120
windrunner.audio.transcription.max-file-size-bytes=10485760
windrunner.audio.transcription.connect-timeout=10s
windrunner.audio.transcription.read-timeout=2m
windrunner.audio.transcription.openai.api-key=${OPENAI_TRANSCRIPTION_API_KEY:${OPENAI_API_KEY:}}
windrunner.audio.transcription.openai.base-url=${OPENAI_TRANSCRIPTION_BASE_URL:https://api.openai.com/v1}
windrunner.audio.transcription.openai.model=${OPENAI_TRANSCRIPTION_MODEL:gpt-transcribe}
windrunner.audio.transcription.gemini.api-key=${GEMINI_TRANSCRIPTION_API_KEY:${GEMINI_API_KEY:}}
windrunner.audio.transcription.gemini.base-url=${GEMINI_TRANSCRIPTION_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
windrunner.audio.transcription.gemini.model=${GEMINI_TRANSCRIPTION_MODEL:gemini-2.5-flash}

windrunner.llm.gemini.api-key=${GEMINI_API_KEY:}
windrunner.llm.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
windrunner.llm.gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
windrunner.llm.gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:2048}
windrunner.llm.gemini.temperature=${GEMINI_TEMPERATURE:1.0}
windrunner.llm.gemini.max-tool-rounds=${GEMINI_MAX_TOOL_ROUNDS:8}
windrunner.llm.gemini.parallel-tool-timeout=30s

windrunner.llm.claude.api-key=${CLAUDE_API_KEY:}
windrunner.llm.claude.base-url=${CLAUDE_BASE_URL:https://api.anthropic.com/v1}
windrunner.llm.claude.model=${CLAUDE_MODEL:claude-sonnet-5}
windrunner.llm.claude.max-output-tokens=${CLAUDE_MAX_OUTPUT_TOKENS:2048}
windrunner.llm.claude.temperature=${CLAUDE_TEMPERATURE:1.0}
windrunner.llm.claude.max-tool-rounds=${CLAUDE_MAX_TOOL_ROUNDS:8}
windrunner.llm.claude.parallel-tool-timeout=30s


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
