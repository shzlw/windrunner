spring.main.banner-mode=off
spring.application.name=windrunner
spring.jmx.enabled=false

server.port=8066
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.forward-headers-strategy=framework

server.compression.enabled=true
server.compression.min-response-size=2KB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Windrunner server

spring.ai.mcp.server.enabled=${WINDRUNNER_MCP_ENABLED:true}
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.name=windrunner
spring.ai.mcp.server.version=${info.app.version:2.0}

windrunner.openapi.enabled=${WINDRUNNER_OPENAPI_ENABLED:true}
springdoc.api-docs.enabled=${windrunner.openapi.enabled}
springdoc.api-docs.path=/api/openapi.json
springdoc.packages-to-scan=com.windrunner.server.external.v1.api
springdoc.paths-to-match=/api/v1/**

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

windrunner.auth.cookie.secure=true

windrunner.llm.openai.api-key=${OPENAI_API_KEY:}
windrunner.llm.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
windrunner.llm.openai.model=${OPENAI_MODEL:gpt-5.6-luna}
windrunner.llm.openai.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:2048}
windrunner.llm.openai.reasoning-effort=${OPENAI_REASONING_EFFORT:low}
windrunner.llm.openai.max-tool-rounds=${OPENAI_MAX_TOOL_ROUNDS:8}

windrunner.llm.gemini.api-key=${GEMINI_API_KEY:}
windrunner.llm.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
windrunner.llm.gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
windrunner.llm.gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:2048}
windrunner.llm.gemini.temperature=${GEMINI_TEMPERATURE:1.0}
windrunner.llm.gemini.max-tool-rounds=${GEMINI_MAX_TOOL_ROUNDS:8}

windrunner.llm.claude.api-key=${CLAUDE_API_KEY:}
windrunner.llm.claude.base-url=${CLAUDE_BASE_URL:https://api.anthropic.com/v1}
windrunner.llm.claude.model=${CLAUDE_MODEL:claude-sonnet-5}
windrunner.llm.claude.max-output-tokens=${CLAUDE_MAX_OUTPUT_TOKENS:2048}
windrunner.llm.claude.temperature=${CLAUDE_TEMPERATURE:1.0}
windrunner.llm.claude.max-tool-rounds=${CLAUDE_MAX_TOOL_ROUNDS:8}


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
